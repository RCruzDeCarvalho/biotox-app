  const q=norm($("#q").value.trim()),g=$("#fGroup").value,c=$("#fCab").value,st=$("#fStatus").value,al=$("#fAlert").checked,mv=$("#fMove").checked;
  return items.filter(it=>{
    if(g&&it.group!==g)return false;
    if(c&&it.cab!==c)return false;
    if(st==="activos"&&!(it.status==="Em stock"||it.status==="Em uso"))return false;
    if(st&&st!=="activos"&&it.status!==st)return false;
    if(al&&!it.action)return false;
    if(mv&&it.moved)return false;
    if($("#fSds").checked&&it.sds)return false;
    if(q){const hay=norm([it.code,it.name,it.cas,it.old,it.brand,it.ref,it.obs].join(" "));return q.split(/\s+/).every(w=>hay.includes(w))}
    return true});
}

function render(){

  const f=filtered();
  const act=items.filter(i=>i.status==="Em stock"||i.status==="Em uso").length,todo=items.filter(i=>!i.moved).length;
  const nf=items.filter(i=>i.sds).length;

function fdsLinks(it){
  const b=(it.brand||"").toLowerCase(),term=(it.ref||it.cas||it.name).trim(),out=[];
  if(/sigma|aldrich|fluka|merck|supelco|millipore|calbiochem|safc|riedel/.test(b)&&term)
    out.push(["Procurar na Sigma/Merck",`https:\/\/www.sigmaaldrich.com/PT/pt/search/${encodeURIComponent(term)}?focus=products&page=1&perpage=30&sort=relevance&term=${encodeURIComponent(term)}&type=product`]);
  out.push(["Procurar FDS na web",`https:\/\/www.google.com/search?q=${encodeURIComponent(["SDS",it.brand,it.ref,it.cas&&it.cas!=="—"?it.cas:it.name,"pdf"].filter(Boolean).join(" "))}`]);
  if(it.cas&&/^\d+-\d+-\d$/.test(it.cas))out.push(["Perigos GHS no PubChem",`https:\/\/pubchem.ncbi.nlm.nih.gov/#query=${encodeURIComponent(it.cas)}`]);
  return out.map(([t,u])=>`<a class="ext" href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`).join("");
}

const SHELF_ORDER=s=>{const m=String(s).match(/(\d+)/);return m?parseInt(m[1],10):99};

function fillShelves(){const sel=$("#cShelf"),cur=sel.value;const ss=[...new Set(cons.map(c=>c.cab).filter(Boolean))].sort((a,b)=>a.localeCompare(b));

const isLow=c=>c.min!==null&&c.min!==undefined&&c.qty<=c.min;
function consFiltered(){const q=norm($("#cq").value.trim()),sh=$("#cShelf").value,low=$("#cLow").checked;
  return cons.filter(c=>{if(sh&&c.cab!==sh)return false;if(low&&!isLow(c))return false;
    if(q){const hay=norm([c.id,c.name,c.type,c.size,c.obs,c.cab,c.shelf].join(" "));return q.split(/\s+/).every(w=>hay.includes(w))}return true})}

function renderCons(){const v=$("#view");$("#ctType").setAttribute("aria-pressed",String(ctab==="type"));$("#ctList").setAttribute("aria-pressed",String(ctab==="list"));$("#ctBuy").setAttribute("aria-pressed",String(ctab==="buy"));

  if(ctab==="buy"){const L=cons.filter(isLow).sort((a,b)=>a.name.localeCompare(b.name));
    if(!L.length){v.innerHTML=`<div class="list"><div class="empty"><strong>Não falta nada</strong>Nenhum consumível está abaixo do mínimo.</div></div>`;return}

  }else{const f=consFiltered();

    $("#iDl").onclick=e=>{e.preventDefault();toast(AND.guardar(url,name||(url.startsWith("data:image/jpeg")?"encomenda.jpg":"encomenda.png"))?"Guardada em Transferências › BIOTOX.":"Não foi possível guardar. Usa Partilhar.")}}
  else $("#iShare").onclick=async()=>{try{const blob=await (await fetch(url)).blob();const file=new File([blob],name||(url.startsWith("data:image/jpeg")?"encomenda.jpg":"encomenda.png"),{type:blob.type||"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name||"Encomenda BIOTOX"})}else throw new Error("x")}
    catch(e){toast("Aqui não dá para partilhar directamente. Descarrega a imagem ou mantém o dedo nela.")}};
  if($("#iEmpty"))$("#iEmpty").onclick=()=>{CART=[];saveCart();closeSheet();$("#view").dataset.v="";render();toast("Lista esvaziada.")}}
async function renderArch(force){const v=$("#view");v.dataset.v="arch";$("#stat").textContent="";
  if(!ARCH||force){v.innerHTML=`<h2 class="ptitle">Arquivo</h2><div class="list"><div class="empty"><strong>A abrir o arquivo</strong>A ler a pasta de encomendas no Drive…</div></div>`;
    try{ARCH=await call("listarArquivo",PIN)}catch(e){v.innerHTML=`<h2 class="ptitle">Arquivo</h2><div class="list"><div class="empty"><strong>Não foi possível abrir o arquivo</strong>${esc(String(e&&e.message||e))}</div></div>`;return}
    if(MODE!=="arch")return}
  const F=ARCH.files||[];$("#stat").textContent=F.length===1?"1 exportação":`${F.length} exportações`;
  const fmt=t=>new Date(t).toLocaleString(LANG==="en"?"en-GB":"pt-PT",{dateStyle:"short",timeStyle:"short"});
  v.innerHTML=`<h2 class="ptitle">Arquivo</h2><p class="pintro">Encomendas exportadas, da mais recente para a mais antiga. ${ARCH.folder?`<a class="lnk" href="${esc(ARCH.folder)}" target="_blank" rel="noopener">Abrir a pasta no Drive</a>`:""}</p>
  ${F.length?`<div class="list">${F.map(f=>`<div class="arow" data-id="${esc(f.id)}"><div class="oname"><b>${fmt(f.at)}</b><span>${[f.by,f.n?(f.n===1?"1 artigo":f.n+" artigos"):"",Math.round(f.size/1024)+" KB"].filter(Boolean).map(esc).join(" · ")}</span></div>
    <button data-see>Ver</button>${PAPEL==="editar"?`<button class="icon del" data-rm title="Apagar" aria-label="Apagar">${IC.trash}</button>`:""}</div>`).join("")}</div>`:`<div class="list"><div class="empty"><strong>Ainda não há exportações</strong>Quando exportares uma encomenda, a imagem fica guardada aqui.</div></div>`}`;
  v.querySelectorAll(".arow").forEach(r=>{const id=r.dataset.id,f=F.find(x=>x.id===id);
    r.querySelector("[data-see]").onclick=async e=>{const b=e.currentTarget;b.disabled=true;try{showImage(await call("verArquivo",PIN,id),f.name,f.url,false)}catch(err){toast(errMsg(err))}finally{b.disabled=false}};
    const rm=r.querySelector("[data-rm]");if(rm)rm.onclick=async()=>{if(!rm.dataset.ok){rm.dataset.ok="1";rm.classList.add("arm");toast("Toca outra vez no lixo para apagar.");setTimeout(()=>{if(rm.isConnected){delete rm.dataset.ok;rm.classList.remove("arm")}},4000);return}
      try{ARCH=await call("apagarArquivo",PIN,id,me);toast("Apagada. Fica 30 dias no lixo do Drive.");renderArch()}catch(err){toast(errMsg(err))}}})}
function defMin(t){const v=DEFS.mins&&DEFS.mins[t];return v!==undefined&&v!==null&&v!==""?v:DEFS.minDefault}
function renderSet(){const v=$("#view");if(PAPEL!=="editar"){setMode("home");return}
  if(v.dataset.v==="set"&&v.contains(document.activeElement)&&document.activeElement.matches("input"))return;v.dataset.v="set";$("#stat").textContent="";
  const tps=[...new Set(TYPES.concat(cons.map(c=>c.type).filter(Boolean)))].sort((a,b)=>TYPE_ORDER(a)-TYPE_ORDER(b)||a.localeCompare(b));
  v.innerHTML=`<h2 class="ptitle">Definições</h2><p class="pintro">Quando a quantidade de um consumível chega ao mínimo, ele aparece “em falta” e entra na lista de compras. Aqui defines o mínimo de cada tipo.</p>
  <div class="list setl">${tps.map(t=>`<label class="srow"><span>${esc(t)}<small>${(n=>n===1?"1 artigo":n+" artigos")(cons.filter(c=>(c.type||"Outros")===t).length)}</small></span><input type="number" min="0" step="1" inputmode="numeric" data-t="${esc(t)}" value="${esc(defMin(t))}"></label>`).join("")}
  <label class="srow"><span>Mínimo para tipos novos<small>usado quando um tipo não tem mínimo próprio</small></span><input type="number" min="0" step="1" inputmode="numeric" id="sDef" value="${esc(DEFS.minDefault)}"></label></div>
  <label class="chk" style="margin:12px 0"><input type="checkbox" id="sApply" checked> Aplicar já a todos os consumíveis destes tipos</label>
  <p class="hint">Se desligares esta opção, os mínimos só valem para artigos novos. Podes sempre mudar o mínimo de um artigo na ficha dele.</p>
  <div class="actions"><button class="primary" id="sSave">Guardar definições</button></div>
  <h2 class="ptitle" style="margin-top:28px">Fotografias</h2><p class="pintro">As fotografias dos reagentes e dos consumíveis ficam no Drive, na pasta Lab Stock › Fotografias.</p>
  <div class="actions" style="justify-content:flex-start" id="sFotos"><span class="hint">A procurar a pasta…</span></div>`;
  call("pastaDasFotos",PIN).then(u=>{const el=$("#sFotos");if(el)el.innerHTML=`<a class="ext" href="${esc(u)}" target="_blank" rel="noopener">Abrir a pasta das fotografias</a>`}).catch(err=>{const el=$("#sFotos");if(el)el.innerHTML=`<span class="hint">${esc(errMsg(err))}</span>`});
  $("#sSave").onclick=async e=>{const b=e.currentTarget;const mins={};v.querySelectorAll("input[data-t]").forEach(i=>{if(i.value!=="")mins[i.dataset.t]=Math.max(0,parseInt(i.value,10)||0)});
    b.disabled=true;try{const d=await call("guardarDefinicoes",PIN,{minDefault:Math.max(0,parseInt($("#sDef").value,10)||0),mins},$("#sApply").checked,me);v.dataset.v="";applyData(d);toast("Definições guardadas.")}catch(err){toast(errMsg(err))}finally{if(b.isConnected)b.disabled=false}}}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$("#cartBarGo").onclick=()=>setMode("order");

$("#fGate").onsubmit=async e=>{e.preventDefault();$("#gErr").hidden=true;const pin=$("#gPin").value.trim(),nm=$("#gName").value.trim();
  try{const d=await call("getData",pin);PIN=pin;me=nm;store("btx-pin",pin);store("btx-name",nm);$("#gate").hidden=true;$("#app").hidden=false;$("#btnNew").disabled=false;applyData(d);setMode("home")}
  catch(err){$("#gErr").textContent=String(err&&err.message||err).includes("CODIGO_ERRADO")?"Código errado. Pede-o ao Ricardo.":"Não foi possível ligar à folha.";$("#gErr").hidden=false}};
PIN=load("btx-pin");me=load("btx-name");$("#gName").value=me;
if(PIN&&me)enter();else{$("#gate").hidden=false}
setInterval(()=>{if(PIN&&document.visibilityState==="visible"&&$("#sheet").hidden)refresh(true)},60000);
</script>
</body></html>
