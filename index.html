<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stocks BIOTOX</title>
<meta name="theme-color" content="#0d5c6e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BIOTOX">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;background:#0f161b}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
  iframe{border:0;width:100%;height:100%;display:block;background:#0f161b}
  #off{display:none;color:#e4ebef;font:16px system-ui,sans-serif;text-align:center;padding:30vh 24px 0}
</style>
</head>
<body>
<!-- O link da app está no ficheiro config.js -->
<iframe id="app" title="Stocks BIOTOX" allow="clipboard-write"></iframe>
<div id="off">Sem ligação à internet.<br>A app precisa de rede para ler a folha do laboratório.</div>
<script src="config.js"></script>
<script>
  const U = window.BIOTOX_APP_URL || "";
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(U)) { document.getElementById("off").innerHTML = "Falta pôr o link da app no ficheiro config.js."; document.getElementById("off").style.display = "block"; document.getElementById("app").style.display = "none"; }
  else document.getElementById("app").src = U;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  function net(){ const on = navigator.onLine; document.getElementById('app').style.display = on ? 'block' : 'none'; document.getElementById('off').style.display = on ? 'none' : 'block'; }
  addEventListener('online', () => { net(); document.getElementById('app').src = document.getElementById('app').src; });
  addEventListener('offline', net); if (U.endsWith('/exec')) net();

  // Partilhar / guardar a imagem da encomenda. A app corre dentro de molduras do Google que não deixam
  // abrir o menu de partilha do telemóvel, por isso pede a esta página (a de cima) que o faça.
  addEventListener('message', async e => {
    const d = e.data || {};
    if (d.type !== 'btx-share' && d.type !== 'btx-save') return;
    let host = ''; try { host = new URL(e.origin).hostname; } catch (_) {}
    if (!/\.googleusercontent\.com$/.test(host)) return;
    const reply = (extra) => { try { e.source.postMessage(Object.assign({ type: d.type + '-r', id: d.id }, extra), e.origin); } catch (_) {} };
    reply({ ack: true });
    const A = window.BiotoxAndroid;
    try {
      if (A) return reply({ ok: !!(d.type === 'btx-share' ? A.partilhar(d.url, d.name) : A.guardar(d.url, d.name)), done: true, android: true });
      if (d.type === 'btx-save') {
        const a = document.createElement('a'); a.href = d.url; a.download = d.name || 'encomenda';
        document.body.appendChild(a); a.click(); a.remove(); return reply({ ok: true, done: true });
      }
      const blob = await (await fetch(d.url)).blob();
      const file = new File([blob], d.name || 'encomenda', { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: d.title || 'Encomenda BIOTOX' });
        reply({ ok: true, done: true });
      } else reply({ ok: false, done: true, msg: 'sem-suporte' });
    } catch (err) { reply({ ok: false, done: true, msg: (err && err.name) || 'erro' }); }
  });
</script>
</body>
</html>
